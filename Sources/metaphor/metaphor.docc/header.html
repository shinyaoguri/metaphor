<!--
  英語版リファレンスのヘッダー（ADR-0011）。日本語版は docs/reference/i18n/header.ja.html
  で、`make docs-ja` がカタログを複製してこのファイルと差し替える。

  DocC はこの中身を index.html の <template id="custom-header"> へ入れ、DocC-Render が
  Shadow DOM へ clone する（--experimental-enable-custom-templates が要る）。そのため:

  - **<script> は動かない**。clone された script は実行されないうえ、中身がテキストとして
    見えてしまう。だから「今いるページの相手言語」へは飛ばせず、リンク先は各言語のトップに
    なる（JS で現在 URL から相手を組み立てる案は、この制約で使えない）
  - スタイルは Shadow DOM の外から継承されないので、ここに持たせる。ただし CSS カスタム
    プロパティは継承するので、DocC の色変数に乗ればダークモードにも追従する（#529 の
    「light/dark を出し分けられない」問題は、色を自分で決めないかぎり起きない）
-->
<style>
  :host { display: block; }
  .bar {
    display: flex;
    justify-content: flex-end;
    gap: 0.75rem;
    align-items: baseline;
    padding: 0.35rem 1.5rem;
    font-family: var(--typography-html-font, system-ui, sans-serif);
    font-size: 0.75rem;
    background: var(--color-fill-secondary, #f5f5f7);
    border-bottom: 1px solid var(--color-grid, rgba(128, 128, 128, 0.25));
    color: var(--color-figure-gray-secondary, #6e6e73);
  }
  .bar a {
    color: var(--color-link, #0070c9);
    text-decoration: none;
  }
  .bar a:hover { text-decoration: underline; }
  .current { font-weight: 600; color: var(--color-figure-gray, #1d1d1f); }
</style>
<nav class="bar" aria-label="Reference language">
  <span class="current" aria-current="true">English</span>
  <a href="/metaphor/reference/ja/documentation/metaphor/" hreflang="ja" lang="ja">日本語</a>
</nav>
