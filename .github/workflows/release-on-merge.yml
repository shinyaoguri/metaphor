name: Release on merge

# The express lane. Normal changes ride the weekly train
# (release-train.yml); this workflow exists for the merges that must not wait
# for Monday — a hotfix, or a release deliberately cut at a chosen moment.
#
# It fires only when the merged PR carries one of:
#   release:now                  -> release immediately, bump inferred from the
#                                   PR title (feat: minor / fix, perf: patch /
#                                   anything else: patch — an express departure
#                                   always ships something)
#   release:major|minor|patch    -> release immediately with that exact bump.
#                                   `release:major` is the only way to cut a
#                                   major: neither this workflow nor the train
#                                   ever infers one (docs/api-stability-policy.md).
#
# An unlabelled PR merges normally and ships with the next train — which is the
# normal case, and why the train had to exist: labels are easy to forget when
# `gh pr merge --auto` merges the moment CI turns green.
#
# release.yml stays the single source of release logic (Syphon build,
# Package.swift/version bump, tag, GitHub Release, cli Syphon-pin dispatch);
# both entry points only decide *whether* and *how much* to bump. The Release
# workflow's own "Release vX.Y.Z" PR merges unlabelled, so it never re-fires
# this workflow — no loop.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  actions: write # dispatch release.yml via workflow_dispatch
  contents: read

jobs:
  dispatch-release:
    if: >
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release:now') ||
       contains(github.event.pull_request.labels.*.name, 'release:patch') ||
       contains(github.event.pull_request.labels.*.name, 'release:minor') ||
       contains(github.event.pull_request.labels.*.name, 'release:major'))
    runs-on: ubuntu-latest
    steps:
      # Only needed for scripts/release-bump.py, which keeps the title -> bump
      # rule identical here and on the train. No history required: the
      # `--subject` path reads the given title, not the log.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Determine bump (explicit label, else PR title)
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if echo "$LABELS" | grep -q 'release:major'; then
            BUMP=major
          elif echo "$LABELS" | grep -q 'release:minor'; then
            BUMP=minor
          elif echo "$LABELS" | grep -q 'release:patch'; then
            BUMP=patch
          else
            # Squash-only repo: the PR title is the commit message on main.
            # `--fallback patch` because `release:now` is an explicit request to
            # ship — even a chore-titled PR (a pin bump, a rebuilt asset) has to
            # produce a version.
            BUMP=$(python3 scripts/release-bump.py --subject "$TITLE" --fallback patch)
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Labels: [$LABELS] / Title: [$TITLE] -> bump: $BUMP"

      - name: Dispatch Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          gh workflow run release.yml -R "${{ github.repository }}" --ref main -f bump="$BUMP"
          echo "::notice::Dispatched release.yml (bump=$BUMP)."
