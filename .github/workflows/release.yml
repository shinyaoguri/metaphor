name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease   # increment N in vX.Y.Z-LABEL.N (latest tag must be a prerelease)
      prerelease_label:
        description: 'Pre-release label (beta, rc, alpha). Empty = stable. Ignored when bump=prerelease.'
        required: false
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# release:* ラベル付き PR を短時間に複数マージすると release.yml が並走し、
# 同じ latest tag から同じ TAG_NAME / release/<tag> ブランチを計算して衝突する。
# 直列化する（後着はキャンセルせずキュー）。
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write    # required to dispatch CI workflow on the release branch
  statuses: write   # required to bridge check_runs → legacy Status for the ruleset

jobs:
  release:
    runs-on: macos-14
    steps:
      # GITHUB_TOKEN-only flow:
      #
      # - GITHUB_TOKEN cannot bypass branch protection on personal repos.
      # - GITHUB_TOKEN-created PRs do NOT trigger pull_request workflows
      #   (recursion guard), but workflow_dispatch IS exempt from that guard.
      # - So we open the release PR with GITHUB_TOKEN, kick CI explicitly via
      #   `gh workflow run ci.yml --ref <release-branch>`, wait for green,
      #   merge through the standard PR API, then tag.
      #
      # No PAT, no ruleset bypass-actor games.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --- CHANGELOG gate (Issue #335) ---
      # A release has to be able to say what changed. This runs first — before
      # the example smoke build and long before anything irreversible (branch
      # push, merge, tag, Release) — so a forgotten entry costs seconds, not a
      # wasted release attempt. `changelog.py check` fails when `changelog.d/`
      # holds no entry files AND the `## [Unreleased]` section is missing,
      # duplicated or empty; it also rejects a malformed entry filename here,
      # rather than mid-release in the collect step. Its error message spells
      # out the fix, including how to declare "no user-facing changes"
      # explicitly for a release that genuinely has none.
      - name: Require CHANGELOG entries
        run: python3 scripts/changelog.py check

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # --- Examples smoke build（API ドリフトゲート） ---
      # Examples は per-PR CI では検証されない（コスト。ci.yml 参照）ため、
      # 少なくともリリース前には代表セットのビルドで壊れた example を検出する
      # （Issue #147）。失敗するとタグ・Release の発行前に止まる。
      - name: Smoke-build representative examples
        run: ./scripts/run-examples.sh --build-only --smoke

      # run-examples.sh はビルドエラーの詳細をログファイルにしか書かないため、
      # 失敗時はステップ出力へ吐き出す（これがないとランナー内で消えて診断不能）
      - name: Show example build errors
        if: failure()
        run: cat /tmp/metaphor-examples.log || true

      # --- Compute next version ---
      - name: Compute next version
        run: |
          set -euo pipefail
          BUMP="${{ github.event.inputs.bump }}"
          LABEL="${{ github.event.inputs.prerelease_label }}"

          if [ "$BUMP" = "prerelease" ]; then
            # Pick the highest prerelease tag by version order. `git describe`
            # returns the topologically nearest tag, which can be a stable tag
            # (or the wrong cycle) once stable and prerelease tags interleave.
            LATEST_PRE=$(git tag -l 'v*-*' | sort -V | tail -1 || true)
            if [[ "$LATEST_PRE" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-([a-zA-Z]+)\.([0-9]+)$ ]]; then
              BASE="${BASH_REMATCH[1]}"
              PRE_LABEL="${BASH_REMATCH[2]}"
              N="${BASH_REMATCH[3]}"
              if git rev-parse "$BASE" >/dev/null 2>&1; then
                echo "::error::Prerelease cycle ${BASE}-${PRE_LABEL} already graduated to stable ${BASE}. Use bump=patch/minor/major with prerelease_label to start a new cycle."
                exit 1
              fi
              TAG_NAME="${BASE}-${PRE_LABEL}.$((N + 1))"
            else
              echo "::error::bump=prerelease requires an existing prerelease tag (got '${LATEST_PRE:-none}'). Use bump=patch/minor/major with prerelease_label to start a new prerelease cycle."
              exit 1
            fi
          else
            # Find latest STABLE tag (no '-' suffix). sort -V handles version ordering.
            LATEST_STABLE=$(git tag -l 'v*' | grep -v -- '-' | sort -V | tail -1 || true)
            LATEST_STABLE=${LATEST_STABLE:-v0.0.0}
            VERSION=${LATEST_STABLE#v}
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            TARGET="v${MAJOR}.${MINOR}.${PATCH}"

            if [ -n "$LABEL" ]; then
              # Find next free vTARGET-LABEL.N
              N=1
              while git rev-parse "${TARGET}-${LABEL}.${N}" >/dev/null 2>&1; do
                N=$((N + 1))
              done
              TAG_NAME="${TARGET}-${LABEL}.${N}"
            else
              TAG_NAME="$TARGET"
            fi
          fi

          echo "Computed tag: $TAG_NAME"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_BRANCH=release/$TAG_NAME" >> "$GITHUB_ENV"
          if [[ "$TAG_NAME" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      # --- Push release branch with version-bump commit ---
      - name: Push release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Identity for the annotated tag later in this job. The release commit
          # itself is NOT made with `git commit` — see the end of this step.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # main's HEAD is an already-signed commit; the release branch starts
          # there and the bump is layered on through the API.
          BASE_SHA=$(git rev-parse HEAD)
          git checkout -b "$RELEASE_BRANCH"
          # Bump the runtime version constant for EVERY release (stable and
          # prerelease) so a running sketch reports its exact metaphor version.
          VERSION_NUM=${TAG_NAME#v}
          sed -i '' "s|public static let version = \"[^\"]*\"|public static let version = \"${VERSION_NUM}\"|" \
            Sources/MetaphorCore/Core/MetaphorVersion.swift
          # Only stable versions appear in `from:` install snippets. Keep every
          # file that carries the snippet in sync — CI on this release branch
          # enforces agreement (validate-ai-docs.sh check #6 compares
          # README.en.md, GettingStarted.md, llms.txt and the landing page's
          # Hero.astro against README.md, and
          # the llms.txt staleness check regenerates with the README version
          # embedded), so updating README.md alone deadlocks the release.
          # NOTE: this list and validate-ai-docs.sh's `version_docs` are two
          # halves of one contract — always change them together. Adding a file
          # to only one side deadlocks releases in either direction (validate
          # only → the file is never bumped but is checked; sed only → the file
          # is bumped but nothing guards it from drifting back).
          if [ "$IS_PRERELEASE" = "false" ]; then
            VERSION_NUM=${TAG_NAME#v}
            # Anchor on the dependency URL so unrelated `from:` parameter
            # labels (e.g. tween(from:to:)) in llms.txt are left alone. The
            # anchor deliberately stops at `metaphor.git` rather than the full
            # host, because the landing page elides it for width
            # ("…/metaphor.git") — the replacement keeps whatever prefix is
            # already there.
            sed -i '' "s|metaphor\.git\", from: \"[0-9][^\"]*\"|metaphor.git\", from: \"${VERSION_NUM}\"|g" \
              README.md \
              README.en.md \
              Sources/metaphor/metaphor.docc/GettingStarted.md \
              llms.txt \
              website/src/components/Hero.astro
            # Fold `changelog.d/*.md` into `## [Unreleased]`, then promote it
            # into this version's section (Issue #335). Stable-only, matching
            # the `from:` snippets above: a prerelease cycle keeps accumulating
            # entries — in changelog.d/ and under Unreleased — until it
            # graduates, so vX.Y.Z ships the notes for the whole cycle.
            # Already gated by the "Require CHANGELOG entries" step; this call
            # re-checks and fails rather than writing an empty section.
            python3 scripts/changelog.py release "${VERSION_NUM}" --date "$(date -u +%Y-%m-%d)"
          fi
          # The exact file set the bump is allowed to touch. Scoping matters:
          # unscoped, `git status` on a runner would also see build output that
          # merely happens not to be ignored (Frameworks/, artifacts, caches).
          BUMP_PATHS=(
            Sources/MetaphorCore/Core/MetaphorVersion.swift
            README.md
            README.en.md
            Sources/metaphor/metaphor.docc/GettingStarted.md
            llms.txt
            website/src/components/Hero.astro
            CHANGELOG.md
            changelog.d
          )
          if [ -z "$(git status --porcelain -- "${BUMP_PATHS[@]}")" ]; then
            echo "::error::No version-bump diff produced."
            exit 1
          fi
          # The commit goes through GitHub's API, not `git commit`: the ruleset
          # requires signed commits (2026-08-04) and the runner has no signing
          # key, so a pushed `git commit` is unsigned and the release PR then
          # cannot be merged — after a full CI run has already happened (and,
          # back then, a ~10 min Syphon build). That is exactly how v0.9.0 failed on 2026-08-10.
          # `createCommitOnBranch` commits are signed by GitHub itself, which
          # satisfies the rule without opening a ruleset bypass for Actions.
          #
          # signed-commit.py reads `git status --porcelain`, so every edit above
          # is carried as-is — including the DELETION of each collected
          # `changelog.d/` entry. Without those deletions the release would
          # promote the entries and leave the files behind, and the next release
          # would collect them a second time.
          git push origin "${BASE_SHA}:refs/heads/${RELEASE_BRANCH}"
          PATH_ARGS=()
          for bump_path in "${BUMP_PATHS[@]}"; do
            PATH_ARGS+=(--path "$bump_path")
          done
          python3 scripts/signed-commit.py \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$RELEASE_BRANCH" \
            --expected-head "$BASE_SHA" \
            --message "Release ${TAG_NAME}" \
            "${PATH_ARGS[@]}"

      # --- Human-readable release notes (Issue #335) ---
      # Compose the Release body here, while the job can still fail harmlessly
      # (no tag yet). GitHub's auto-generated "What's Changed" list is a wall of
      # PR titles; this puts the CHANGELOG section for the version above it, so
      # the notes lead with what changed and what breaks. `changelog.py notes`
      # is deliberately failure-free — worst case the highlights are omitted and
      # the body still carries the generated list.
      - name: Compose release notes
        run: |
          set -euo pipefail
          VERSION_NUM=${TAG_NAME#v}
          if [ "$IS_PRERELEASE" = "false" ]; then
            SECTION="$VERSION_NUM"     # just collected + promoted by the previous step
          else
            # Prereleases preview the pending section: `notes unreleased` folds
            # the still-uncollected changelog.d/ entries in for display only.
            SECTION="unreleased"
          fi
          BODY="$RUNNER_TEMP/release-body.md"
          python3 scripts/changelog.py notes "$SECTION" > "$BODY"
          echo "RELEASE_BODY_PATH=$BODY" >> "$GITHUB_ENV"
          echo "--- release body ---"
          cat "$BODY"

      # --- Open PR, kick CI manually, wait, merge ---
      - name: Open PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Release ${TAG_NAME}" \
            --body "Automated release commit for ${TAG_NAME}. Bumps Package.swift binary target${{ env.IS_PRERELEASE == 'false' && ' and the install snippets (README.md, README.en.md, GettingStarted.md, llms.txt, Hero.astro)' || '' }}.")
          echo "PR_NUMBER=${PR_URL##*/}" >> "$GITHUB_ENV"

      - name: Trigger CI on release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN-created PRs do not fire the pull_request CI, but
          # workflow_dispatch IS allowed to fire even from another workflow.
          # Capture an ISO timestamp BEFORE the dispatch so we can later
          # filter for the run we just kicked instead of accidentally
          # picking up a prior completed run on a recycled branch name.
          DISPATCH_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "DISPATCH_AT=$DISPATCH_AT" >> "$GITHUB_ENV"
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"

      - name: Wait for CI to register and complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Filter by created>=DISPATCH_AT so we never lock onto a stale
          # historical run (release/<tag> branch names can be recycled).
          deadline=$((SECONDS + 180))
          RUN_ID=""
          while [ $SECONDS -lt $deadline ]; do
            RUN_ID=$(gh run list \
              --workflow=ci.yml \
              --branch "$RELEASE_BRANCH" \
              --event workflow_dispatch \
              --created ">=$DISPATCH_AT" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty' 2>/dev/null || true)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::CI workflow_dispatch run did not register within 180s."
            exit 1
          fi
          echo "Watching CI run $RUN_ID (dispatched at $DISPATCH_AT)..."
          gh run watch "$RUN_ID" --exit-status

      - name: Bridge CI to legacy Status for ruleset gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Repository rulesets on personal repos evaluate the
          # required_status_checks rule against the legacy Statuses API,
          # NOT the modern Checks API. GitHub Actions reports its result
          # only as a check_run, so the ruleset stays unsatisfied even
          # though CI is green. Mirror our successful check_run as a
          # status with the same context so the rule is satisfied.
          # The required context is the aggregate gate `ci-gate` (Issue #411).
          # ci.yml's own bridge step posts this too, but belt-and-suspenders:
          # this workflow must not depend on the dispatched run's bridging.
          PR_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${PR_SHA}" \
            -f state=success \
            -f context=ci-gate \
            -f description="CI passed via workflow_dispatch run"

      - name: Squash-merge release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch

      # --- Tag the merged commit on main ---
      - name: Tag the merged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Tag the squash commit this PR actually produced. Tagging the tip of
          # main after a pull races with anything merged in the meantime — an
          # unrelated commit could end up tagged as the release.
          MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')
          if [ -z "$MERGE_SHA" ] || [ "$MERGE_SHA" = "null" ]; then
            echo "::error::Could not resolve the merge commit for PR #${PR_NUMBER}."
            exit 1
          fi
          git fetch origin main
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME" "$MERGE_SHA"
          git push origin "$TAG_NAME"

      # --- GitHub Release ---
      # No binary assets any more: the Syphon.xcframework moved to the
      # metaphor-syphon package together with the binaryTarget (#792 / ADR-0014),
      # so a metaphor tag is consumable the moment it exists.
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          # Written by "Compose release notes" above: CHANGELOG highlights.
          # action-gh-release prepends it to the generated "What's Changed" list.
          body_path: ${{ env.RELEASE_BODY_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
