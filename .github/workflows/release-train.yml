name: Release train

# Weekly departure: every Monday, look at what landed on main since the latest
# stable tag and release it — or don't, if nothing user-facing landed.
#
# Why a train and not a release per merge: metaphor is a SwiftPM library whose
# every release builds and publishes a Syphon.xcframework asset and dispatches a
# pin bump into metaphor-cli (which then cuts its own release). Releasing on
# each feat/fix merge would have produced 19 releases in the nine days after
# v0.8.0 — and 19 downstream ones. Batching keeps the CHANGELOG readable at a
# version's granularity and the cross-repo chatter weekly.
#
# Why a train and not a label: the label path (release-on-merge.yml) sat unused
# for 40 consecutive merged PRs while 19 feat/fix commits piled up, because
# `gh pr merge --auto` merges the moment CI turns green and leaves no reliable
# moment to attach a label. The train carries no state to forget: scripts/
# release-bump.py re-derives the bump from `main`'s history every time, so a
# skipped or failed run costs nothing — next Monday reaches the same answer.
#
# `release:now` on a PR still ships immediately (release-on-merge.yml), and
# prereleases stay on the Release workflow's manual `workflow_dispatch`.
on:
  schedule:
    - cron: '0 0 * * 1' # Mondays 00:00 UTC = 09:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the bump without dispatching Release'
        type: boolean
        default: true

permissions:
  actions: write # dispatch release.yml via workflow_dispatch
  contents: read

concurrency:
  group: release-train

jobs:
  depart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the bump is derived from history since the latest tag

      # A release hands off to metaphor-cli with a GitHub App installation token
      # (release.yml, "Dispatch Syphon pin bump"). That step runs only when a
      # release actually departs — a few times a month — so a mistyped secret, a
      # rotated private key or a narrowed App installation would sit unnoticed
      # until the next release, and the hand-off would fail after the ~10 min
      # Syphon build and a full CI run.
      #
      # The train runs EVERY Monday, bump or no bump. Minting the token here (and
      # throwing it away) turns that weekly tick into a liveness check on the
      # credential: it costs one API call, and it fails loudly on the week the
      # credential dies rather than on the release that needed it.
      #
      # This is not redundant with metaphor-cli's release-pipeline-audit.yml —
      # that one reports a delivery that already failed to arrive; this one
      # reports the cause before anything is dispatched.
      - name: Verify downstream dispatch credentials
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.REPO_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_APP_PRIVATE_KEY }}
          owner: shinyaoguri
          repositories: metaphor-cli

      # Exits 2 on a breaking change: since v0.9.0 that means major, and major
      # is never inferred (docs/api-stability-policy.md). A red train is the
      # intended outcome there — it asks for the `release:major` label.
      - name: Decide the bump from history
        id: bump
        run: python3 scripts/release-bump.py --explain --github-output "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.bump.outputs.bump == ''
        run: echo "::notice::No feat/fix merged since the latest stable tag — no departure this week."

      # release.yml re-checks this and aborts before anything irreversible, so
      # the release would be safe either way. Failing here instead means the
      # missing entry is reported as "the train could not depart" rather than
      # as a half-run release job.
      - name: Require CHANGELOG entries
        if: steps.bump.outputs.bump != ''
        run: python3 scripts/changelog.py check

      - name: Dispatch Release workflow
        if: steps.bump.outputs.bump != '' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          gh workflow run release.yml -R "${{ github.repository }}" --ref main -f bump="$BUMP"
          echo "::notice::Dispatched release.yml (bump=$BUMP)."

      - name: Dry run summary
        if: steps.bump.outputs.bump != '' && github.event.inputs.dry_run == 'true'
        run: echo "::notice::Dry run — would have dispatched release.yml with bump=${{ steps.bump.outputs.bump }}."
