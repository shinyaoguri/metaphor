name: Examples Sweep

# Examples（271 パッケージ）は per-PR CI では検証しない（各 example が独立した
# SwiftPM パッケージで metaphor をフルビルドするためコストが高い。ci.yml の
# コメント参照）。代わりに:
#   - 週次: 代表セット（scripts/ci-smoke-examples.txt、~19 件）をビルドして
#     公開 API ドリフトを検出する
#   - 手動: workflow_dispatch の full=true で全数スイープ
#   - リリース前: release.yml が同じ代表セットをビルドする
# 失敗はこの workflow の失敗として可視化される（Issue #147）。
on:
  schedule:
    - cron: '0 21 * * 5'   # 毎週土曜 06:00 JST（金曜 21:00 UTC）
  workflow_dispatch:
    inputs:
      full:
        description: 'Build ALL examples instead of the smoke subset'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: examples-sweep
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Build examples
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            ./scripts/run-examples.sh --build-only --log "$RUNNER_TEMP/examples.log"
          else
            ./scripts/run-examples.sh --build-only --smoke --log "$RUNNER_TEMP/examples.log"
          fi
      # 失敗の本文はスクリプトが --log のファイルへ書いている（run-examples.sh の
      # `=== BUILD FAILURE: <path> ===`）。書いていないのではなく、**ランナーごと
      # 捨てられていた** — job が終わればファイルは消えるので、回収しなければ GitHub
      # 側から中身に到達できない。実際それで #1102（DynamicParticlesImmediate が CI
      # でのみ失敗）が 3 週間追えないままになった（#1103）。
      #
      # ログに直接出すのは、短い失敗なら artifact を開くより速いから。artifact も
      # 残すのは、全数スイープで何十本も落ちるとログが流れるため。golden image の
      # 差分画像を artifact へ上げている ci.yml と同じ考え方。
      - name: Show build failures
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/examples.log" ]; then
            echo "::group::examples build log"
            cat "$RUNNER_TEMP/examples.log"
            echo "::endgroup::"
          else
            echo "::warning::no build log at $RUNNER_TEMP/examples.log"
          fi
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: examples-build-log
          path: ${{ runner.temp }}/examples.log
          if-no-files-found: ignore
          retention-days: 14
