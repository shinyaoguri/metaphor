name: Documentation

on:
  push:
    branches: [main]
    # website のビルド入力を漏らさないこと。Astro はチュートリアル本文のコピーを
    # 持たず `docs/tutorial/` を content collection として直接読むので、ここに無いと
    # 本文だけを変えた push でサイトが更新されない（Issue #554）。
    # `website/src/content.config.ts` の loader base との突き合わせは
    # scripts/check-docs-workflow-paths.py が CI で毎 PR 検査する。
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'website/**'
      - 'docs/tutorial/**'
      # 日本語リファレンス（ADR-0011）の入力。台帳やヘッダーだけを直した push でも
      # /reference/ja/ を作り直さないと、英語版だけが新しい状態で公開され続ける。
      - 'docs/reference/i18n/**'
      - 'scripts/translate-reference.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
