name: Documentation

on:
  push:
    branches: [main]
    # website のビルド入力を漏らさないこと。Astro はチュートリアル本文のコピーを
    # 持たず `docs/tutorial/` を content collection として直接読むので、ここに無いと
    # 本文だけを変えた push でサイトが更新されない（Issue #554）。
    # `website/src/content.config.ts` の loader base との突き合わせは
    # scripts/check-docs-workflow-paths.py が CI で毎 PR 検査する。
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'website/**'
      - 'docs/tutorial/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Get Syphon submodule hash
        id: syphon-hash
        run: echo "hash=$(git submodule status Vendor/Syphon-Framework | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Get Xcode version
        id: xcode-version
        run: echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache Syphon.xcframework
        id: cache-syphon
        uses: actions/cache@v6
        with:
          path: Frameworks/Syphon.xcframework
          key: syphon-xcframework-${{ steps.syphon-hash.outputs.hash }}-${{ hashFiles('scripts/build-syphon.sh') }}-${{ steps.xcode-version.outputs.version }}
      - name: Build Syphon
        if: steps.cache-syphon.outputs.cache-hit != 'true'
        run: make setup
      - name: Build Library and extract symbol graphs (parallel)
        run: make symbol-graphs
      - name: Build DocC Documentation
        # base path は Astro のサイト（/metaphor/）ではなくその配下の /reference/。
        # DocC は baseUrl を出力へ焼き込むので、これで JS / CSS / theme-settings.json
        # の参照が /metaphor/reference/... を向き、下の cp と噛み合う。
        run: |
          xcrun docc convert Sources/metaphor/metaphor.docc \
            --additional-symbol-graph-dir .build/symbol-graphs \
            --transform-for-static-hosting \
            --hosting-base-path metaphor/reference \
            --output-path .build/docs
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Build Landing Page
        run: |
          cd website
          npm ci
          npm run build
      - name: Place DocC reference under /reference/
        # 2 つのビルドを **混ぜない**。Astro（LP + /tutorial/）は website/dist の
        # ルート、DocC は丸ごと /reference/ 配下。Astro が生成しないパスなので
        # 衝突が起きず、コピー対象の列挙も要らない。
        #
        # かつては DocC の出力をルートへ重ねており、トップの index.html などが
        # 衝突するためコピー対象を固定リストで列挙していた。その結果 images /
        # videos / downloads / metadata.json / theme-settings.json を取りこぼし、
        # テーマ設定が公開サイトで効いていなかった（Issue #529）。
        #
        # 404.html は要らない: --transform-for-static-hosting が全ページの実体を
        # 出すので client-side routing のフォールバックに頼る必要がなく、旧 URL
        # (/metaphor/documentation/**) の救済は website 側の 404 ページが担う。
        run: |
          cp -R .build/docs website/dist/reference
          # Disable Jekyll processing
          touch website/dist/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
