name: Documentation

on:
  push:
    branches: [main]
    # website のビルド入力を漏らさないこと。Astro はチュートリアル本文のコピーを
    # 持たず `docs/tutorial/` を content collection として直接読むので、ここに無いと
    # 本文だけを変えた push でサイトが更新されない（Issue #554）。
    # `website/src/content.config.ts` の loader base との突き合わせは
    # scripts/check-docs-workflow-paths.py が CI で毎 PR 検査する。
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'website/**'
      - 'docs/tutorial/**'
      # 日本語リファレンス（ADR-0011）の入力。台帳やヘッダーだけを直した push でも
      # /reference/ja/ を作り直さないと、英語版だけが新しい状態で公開され続ける。
      - 'docs/reference/i18n/**'
      - 'scripts/translate-reference.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Build Library and extract symbol graphs (parallel)
        run: make symbol-graphs
      - name: Build DocC Documentation
        # base path は Astro のサイト（/metaphor/）ではなくその配下の /reference/。
        # DocC は baseUrl を出力へ焼き込むので、これで JS / CSS / theme-settings.json
        # の参照が /metaphor/reference/... を向き、下の cp と噛み合う。
        # --experimental-enable-custom-templates は header.html（言語切替）を
        # index.html へ注入させるために要る（ADR-0011）。Makefile の docs と同じ形。
        run: |
          xcrun docc convert Sources/metaphor/metaphor.docc \
            --additional-symbol-graph-dir .build/symbol-graphs \
            --transform-for-static-hosting \
            --experimental-enable-custom-templates \
            --hosting-base-path metaphor/reference \
            --output-path .build/docs
      - name: Build Japanese DocC Documentation
        # 英語の doc コメントが正典で、日本語は台帳を当てた生成物（ADR-0011）。
        # カタログの**ディレクトリ名がドキュメントのルート名になる**ので、複製先でも
        # metaphor.docc の名前を保つ（英語版とのパスの 1:1 対応が言語切替の前提）。
        # 訳が無い箇所は英語のまま残るので、このステップが落ちることはない。
        # Makefile の docs-ja と同じ手順 — 変えるときは両方を揃える。
        run: |
          rm -rf .build/ja-catalog && mkdir -p .build/ja-catalog
          cp -R Sources/metaphor/metaphor.docc .build/ja-catalog/metaphor.docc
          cp docs/reference/i18n/header.ja.html .build/ja-catalog/metaphor.docc/header.html
          xcrun docc convert .build/ja-catalog/metaphor.docc \
            --additional-symbol-graph-dir .build/symbol-graphs \
            --transform-for-static-hosting \
            --experimental-enable-custom-templates \
            --hosting-base-path metaphor/reference/ja \
            --output-path .build/docs-ja
          python3 scripts/translate-reference.py --apply --docs-dir .build/docs-ja
      - name: Report Japanese reference coverage
        # 未訳があっても公開は止めない（英語のまま出る）。#334 が Core を英語化した
        # 直後は必ず未訳が増えるので、ここで気付ければ十分。
        if: always()
        run: |
          python3 scripts/translate-reference.py --check --docs-dir .build/docs \
            >> "$GITHUB_STEP_SUMMARY" || true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Cache remote tutorial images
        # 本文の画像は Gyazo にあり、Astro がビルド時に取得して dist/ へ最適化配置
        # する（ADR-0010）。cacheDir は npm ci で消えない website/.astro-cache に
        # 出してあるので、ここでキャッシュすれば毎回全点を取り直さずに済む。
        # restore-keys があるのが要点 — 台帳が 1 節変わっただけで全点の取り直しに
        # 戻らないよう、直前のキャッシュを土台にして差分だけ取りに行かせる。
        uses: actions/cache@v6
        with:
          path: website/.astro-cache
          key: tutorial-images-${{ hashFiles('docs/tutorial/images/manifest.json') }}
          restore-keys: tutorial-images-
      - name: Build Landing Page
        run: |
          cd website
          npm ci
          npm run build
      - name: Place DocC reference under /reference/
        # 2 つのビルドを **混ぜない**。Astro（LP + /tutorial/）は website/dist の
        # ルート、DocC は丸ごと /reference/ 配下。Astro が生成しないパスなので
        # 衝突が起きず、コピー対象の列挙も要らない。
        #
        # かつては DocC の出力をルートへ重ねており、トップの index.html などが
        # 衝突するためコピー対象を固定リストで列挙していた。その結果 images /
        # videos / downloads / metadata.json / theme-settings.json を取りこぼし、
        # テーマ設定が公開サイトで効いていなかった（Issue #529）。
        #
        # 404.html は要らない: --transform-for-static-hosting が全ページの実体を
        # 出すので client-side routing のフォールバックに頼る必要がなく、旧 URL
        # (/metaphor/documentation/**) の救済は website 側の 404 ページが担う。
        run: |
          cp -R .build/docs website/dist/reference
          # 日本語版は英語版の中の /ja/ へ。パスが 1:1 で対応するので、
          # header.html の言語切替がそのまま噛み合う（ADR-0011）。
          cp -R .build/docs-ja website/dist/reference/ja
          # Disable Jekyll processing
          touch website/dist/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
